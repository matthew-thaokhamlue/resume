<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Abstract Bangkok skyline at dusk framed inside a laptop screen, with one lit window in a tower">
  <defs>
    <linearGradient id="bgR2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14171c"/>
      <stop offset="1" stop-color="#0e1013"/>
    </linearGradient>
    <radialGradient id="glowR2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8a86a" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#c8a86a" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#c8a86a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="windowR2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e2c4"/>
      <stop offset="1" stop-color="#c8a86a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bgR2)"/>
  <rect width="1200" height="900" fill="url(#glowR2)"/>
  <!-- laptop frame -->
  <rect x="260" y="170" width="680" height="440" rx="14" fill="none" stroke="#f2e2c4" stroke-opacity="0.7" stroke-width="2"/>
  <rect x="284" y="192" width="632" height="396" rx="6" fill="none" stroke="#e8d3a8" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M200 640 H1000 Q1000 662 978 662 H222 Q200 662 200 640 Z" fill="none" stroke="#f2e2c4" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="560" y1="646" x2="640" y2="646" stroke="#f2e2c4" stroke-opacity="0.4" stroke-width="2"/>
  <!-- horizon inside the screen -->
  <line x1="284" y1="500" x2="916" y2="500" stroke="#e8d3a8" stroke-opacity="0.2" stroke-width="1"/>
  <!-- skyline inside the screen -->
  <g fill="none" stroke="#e8d3a8" stroke-opacity="0.3" stroke-width="1.5">
    <rect x="330" y="400" width="46" height="100"/>
    <rect x="392" y="360" width="36" height="140"/>
    <rect x="444" y="420" width="54" height="80"/>
    <rect x="700" y="380" width="44" height="120"/>
    <rect x="760" y="330" width="52" height="170"/>
    <rect x="830" y="410" width="40" height="90"/>
    <polyline points="760,330 786,292 812,330"/>
    <polyline points="392,360 410,334 428,360"/>
  </g>
  <!-- main tower -->
  <rect x="548" y="270" width="104" height="230" fill="none" stroke="#f2e2c4" stroke-opacity="0.8" stroke-width="2"/>
  <polyline points="548,270 600,232 652,270" fill="none" stroke="#f2e2c4" stroke-opacity="0.8" stroke-width="2"/>
  <line x1="600" y1="232" x2="600" y2="204" stroke="#f2e2c4" stroke-opacity="0.6" stroke-width="1.5"/>
  <g fill="none" stroke="#e8d3a8" stroke-opacity="0.22" stroke-width="1">
    <rect x="566" y="292" width="18" height="20"/><rect x="591" y="292" width="18" height="20"/><rect x="616" y="292" width="18" height="20"/>
    <rect x="566" y="328" width="18" height="20"/><rect x="591" y="328" width="18" height="20"/><rect x="616" y="328" width="18" height="20"/>
    <rect x="566" y="364" width="18" height="20"/><rect x="616" y="364" width="18" height="20"/>
    <rect x="566" y="400" width="18" height="20"/><rect x="591" y="400" width="18" height="20"/><rect x="616" y="400" width="18" height="20"/>
    <rect x="566" y="436" width="18" height="20"/><rect x="591" y="436" width="18" height="20"/><rect x="616" y="436" width="18" height="20"/>
  </g>
  <rect x="591" y="364" width="18" height="20" fill="url(#windowR2)"/>
  <rect x="584" y="357" width="32" height="34" fill="none" stroke="#f2e2c4" stroke-opacity="0.35" stroke-width="1"/>
  <!-- river inside the screen -->
  <g stroke="#c8a86a" stroke-width="1.5" fill="none">
    <path d="M520 540 Q600 530 680 540" stroke-opacity="0.35"/>
    <path d="M500 566 Q600 554 700 566" stroke-opacity="0.18"/>
  </g>
  <!-- the scroll path: skyline into the frame -->
  <path d="M120 120 C 200 60, 320 60, 420 170" fill="none" stroke="#c8a86a" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M1080 120 C 1000 60, 880 60, 780 170" fill="none" stroke="#c8a86a" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 8"/>
  <!-- outer horizon -->
  <line x1="0" y1="760" x2="1200" y2="760" stroke="#e8d3a8" stroke-opacity="0.12" stroke-width="1"/>
  <g fill="#f2e2c4">
    <circle cx="90" cy="220" r="1.6" fill-opacity="0.5"/>
    <circle cx="1120" cy="260" r="1.4" fill-opacity="0.5"/>
    <circle cx="160" cy="720" r="1.2" fill-opacity="0.35"/>
    <circle cx="1040" cy="700" r="1.2" fill-opacity="0.35"/>
  </g>
</svg>
