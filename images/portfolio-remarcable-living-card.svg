<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Abstract Bangkok skyline at dusk with one lit window, suggesting your own corner of a new city">
  <defs>
    <linearGradient id="bgR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14171c"/>
      <stop offset="1" stop-color="#0e1013"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#c8a86a" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#c8a86a" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#c8a86a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="windowR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e2c4"/>
      <stop offset="1" stop-color="#c8a86a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bgR)"/>
  <rect width="800" height="1000" fill="url(#glowR)"/>
  <!-- horizon hairlines -->
  <line x1="0" y1="640" x2="800" y2="640" stroke="#e8d3a8" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="0" y1="700" x2="800" y2="700" stroke="#e8d3a8" stroke-opacity="0.08" stroke-width="1"/>
  <!-- distant towers -->
  <g fill="none" stroke="#e8d3a8" stroke-opacity="0.28" stroke-width="1.5">
    <rect x="70" y="470" width="60" height="170"/>
    <rect x="150" y="420" width="44" height="220"/>
    <rect x="214" y="500" width="70" height="140"/>
    <rect x="520" y="440" width="52" height="200"/>
    <rect x="596" y="380" width="64" height="260"/>
    <rect x="684" y="480" width="48" height="160"/>
    <polyline points="596,380 628,330 660,380"/>
    <polyline points="150,420 172,388 194,420"/>
  </g>
  <!-- the main tower -->
  <rect x="330" y="280" width="140" height="360" fill="none" stroke="#f2e2c4" stroke-opacity="0.75" stroke-width="2"/>
  <polyline points="330,280 400,220 470,280" fill="none" stroke="#f2e2c4" stroke-opacity="0.75" stroke-width="2"/>
  <line x1="400" y1="220" x2="400" y2="170" stroke="#f2e2c4" stroke-opacity="0.6" stroke-width="1.5"/>
  <!-- unlit windows -->
  <g fill="none" stroke="#e8d3a8" stroke-opacity="0.22" stroke-width="1">
    <rect x="352" y="310" width="22" height="26"/><rect x="389" y="310" width="22" height="26"/><rect x="426" y="310" width="22" height="26"/>
    <rect x="352" y="356" width="22" height="26"/><rect x="389" y="356" width="22" height="26"/><rect x="426" y="356" width="22" height="26"/>
    <rect x="352" y="402" width="22" height="26"/><rect x="426" y="402" width="22" height="26"/>
    <rect x="352" y="448" width="22" height="26"/><rect x="389" y="448" width="22" height="26"/><rect x="426" y="448" width="22" height="26"/>
    <rect x="352" y="494" width="22" height="26"/><rect x="389" y="494" width="22" height="26"/><rect x="426" y="494" width="22" height="26"/>
    <rect x="352" y="540" width="22" height="26"/><rect x="389" y="540" width="22" height="26"/><rect x="426" y="540" width="22" height="26"/>
  </g>
  <!-- the one lit window -->
  <rect x="389" y="402" width="22" height="26" fill="url(#windowR)"/>
  <rect x="381" y="394" width="38" height="42" fill="none" stroke="#f2e2c4" stroke-opacity="0.35" stroke-width="1"/>
  <!-- river reflection -->
  <g stroke="#c8a86a" stroke-width="1.5" fill="none">
    <path d="M320 730 Q400 720 480 730" stroke-opacity="0.35"/>
    <path d="M300 770 Q400 758 500 770" stroke-opacity="0.22"/>
    <path d="M280 812 Q400 798 520 812" stroke-opacity="0.12"/>
  </g>
  <!-- stars -->
  <g fill="#f2e2c4">
    <circle cx="120" cy="120" r="1.6" fill-opacity="0.6"/>
    <circle cx="240" cy="80" r="1.2" fill-opacity="0.5"/>
    <circle cx="560" cy="110" r="1.6" fill-opacity="0.55"/>
    <circle cx="700" cy="180" r="1.2" fill-opacity="0.45"/>
    <circle cx="640" cy="60" r="1" fill-opacity="0.4"/>
    <circle cx="180" cy="230" r="1" fill-opacity="0.4"/>
  </g>
</svg>
